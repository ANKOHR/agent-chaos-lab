[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-chaos-lab"
version = "0.1.0"
description = "A deterministic fault injection harness demonstrated on a fixture agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
chaoslab = "chaoslab.cli:main"

[tool.setuptools.packages.find]
include = ["chaoslab*"]

[tool.setuptools.package-data]
chaoslab = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
